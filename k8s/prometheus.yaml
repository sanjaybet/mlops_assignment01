apiVersion: v1
kind: ConfigMap
metadata:
  name: heart-disease-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
      - job_name: heart-disease-api
        metrics_path: /metrics
        static_configs:
          - targets: ["heart-disease-api.default.svc.cluster.local:80"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-prometheus
  labels:
    app: heart-disease-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-disease-prometheus
  template:
    metadata:
      labels:
        app: heart-disease-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: heart-disease-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-prometheus
  labels:
    app: heart-disease-prometheus
spec:
  selector:
    app: heart-disease-prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
  type: ClusterIP