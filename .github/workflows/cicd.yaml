name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          flake8 src app tests

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: file://${{ github.workspace }}/.mlflow-ci
        run: |
          python src/eda.py
          python src/train.py

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-${{ github.run_id }}
          path: |
            .mlflow-ci/
            screenshots/*.png
            data/processed/model.joblib
          if-no-files-found: warn
          retention-days: 14
